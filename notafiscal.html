<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nota / Recibo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      margin: 0;
      padding: 30px;
    }

    .nota {
      background: white;
      color: #000;
      max-width: 760px;
      margin: 0 auto;
      padding: 35px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    h1, h2 {
      text-align: center;
      margin: 0;
    }

    h1 { color: #0072ff; }
    h2 { margin-top: 8px; }

    .linha {
      border-top: 1px solid #999;
      margin: 25px 0;
    }

    .campo {
      font-size: 18px;
      margin: 14px 0;
    }

    .assinatura {
      margin-top: 60px;
      text-align: center;
    }

    button {
      display: block;
      margin: 25px auto 0;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      background: #0072ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      button {
        display: none;
      }

      .nota {
        max-width: 100%;
        margin: 0;
        border-radius: 0;
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="nota">
    <h1>Óticas Ventura</h1>
    <h2>Nota / Recibo de Atendimento</h2>

    <div class="linha"></div>

    <div class="campo"><b>Cliente:</b> <span id="cliente"></span></div>
    <div class="campo"><b>Produto:</b> <span id="produto"></span></div>
    <div class="campo"><b>Valor:</b> R$ <span id="valor"></span></div>
    <div class="campo"><b>Data:</b> <span id="data"></span></div>

    <div class="linha"></div>

    <p>Obrigado pela preferência.</p>

    <div class="assinatura">
      ___________________________________<br>
      Assinatura do cliente
    </div>
  </div>

  <button onclick="window.print()">🖨️ Imprimir Nota</button>

  <script>
    const params = new URLSearchParams(window.location.search);

    document.getElementById("cliente").innerText = params.get("cliente") || "";
    document.getElementById("produto").innerText = params.get("produto") || "";
    document.getElementById("valor").innerText = params.get("valor") || "";
    document.getElementById("data").innerText = new Date().toLocaleDateString("pt-BR");
  </script>

</body>
</html>
