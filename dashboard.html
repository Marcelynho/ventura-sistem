<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Ventura</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(52, 151, 235, 0.18), transparent 28%),
        linear-gradient(135deg, #062449, #0b4c86);
      color: #17324b;
    }

    body {
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 220px;
      padding: 22px 16px;
      overflow-y: auto;
      background: linear-gradient(180deg, #082b54, #0b4c86);
      box-shadow: 8px 0 28px rgba(0, 0, 0, 0.18);
      z-index: 10;
    }

    .logo-area {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-area img {
      width: 86px;
      height: 86px;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
    }

    .menu {
      display: grid;
      gap: 9px;
    }

    .menu button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 11px 13px;
      color: #07345f;
      background: #55c7df;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      filter: brightness(1.08);
      transform: translateX(3px);
    }

    .menu .ativo {
      color: #ffffff;
      background: #1687e8;
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.16);
    }

    .menu .sair {
      margin-top: 8px;
      color: #ffffff;
      background: #d95368;
    }

    .painel-conteudo {
      width: calc(100% - 220px);
      min-height: 100vh;
      margin-left: 220px;
      padding: 28px;
    }

    .dashboard-home {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .painel-topo {
      margin-bottom: 24px;
      padding: 28px 30px;
      border-radius: 22px;
      color: #ffffff;
      background: linear-gradient(135deg, #082b54, #0d5d9f);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.2);
    }

    .painel-topo h1 {
      margin: 0;
      color: #ffffff;
      font-size: 38px;
    }

    .painel-topo p {
      margin: 8px 0 0;
      color: #d9ecfb;
      font-size: 17px;
      font-weight: 600;
    }

    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .card {
      min-height: 150px;
      padding: 22px;
      border: 1px solid #d8e4ee;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
      color: #0d4d84;
      font-size: 20px;
      font-weight: 700;
      opacity: 1;
    }

    .card .rotulo {
      display: block;
      margin-bottom: 16px;
      color: #60788f;
      font-size: 15px;
    }

    .card .valor {
      display: block;
      color: #0d4d84;
      font-size: 38px;
      line-height: 1;
    }

    .graficos-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grafico-box {
      min-width: 0;
      padding: 22px;
      border: 1px solid #d8e4ee;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
      opacity: 1;
    }

    .grafico-box h2 {
      margin: 0 0 18px;
      color: #0d4d84;
      font-size: 20px;
    }

    .grafico-box canvas {
      width: 100% !important;
      max-width: 100%;
    }

    #conteudoPrincipal {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    @media (max-width: 950px) {
      .sidebar {
        position: static;
        width: 100%;
      }

      body {
        display: block;
      }

      .painel-conteudo {
        width: 100%;
        margin-left: 0;
        padding: 16px;
      }

      .menu {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-cards,
      .graficos-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .menu {
        grid-template-columns: 1fr;
      }

      .painel-topo {
        padding: 22px 18px;
      }

      .painel-topo h1 {
        font-size: 30px;
      }
    }
  
    .modulo-frame {
      display: none;
      width: 100%;
      height: 900px;
      min-height: 760px;
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.20);
    }

    @media (max-width: 950px) {
      .modulo-frame {
        height: 900px;
        min-height: 900px;
        border-radius: 16px;
      }
    }


    .barra-superior{position:sticky;top:0;z-index:8;max-width:1180px;margin:0 auto 20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid rgba(255,255,255,.55);border-radius:16px;background:rgba(255,255,255,.94);box-shadow:0 10px 28px rgba(0,0,0,.14);backdrop-filter:blur(12px)}
    .marca-topo{display:flex;align-items:center;gap:11px;min-width:0}.marca-topo img{width:42px;height:42px;object-fit:cover;border-radius:50%;border:2px solid #cfe5f7}.marca-topo strong{display:block;color:#0b4679;font-size:16px}.marca-topo small{display:block;margin-top:2px;color:#6c8295;font-size:12px}
    .usuario-area{position:relative}.usuario-botao{min-width:205px;padding:7px 10px;display:flex;align-items:center;gap:10px;border:1px solid #d7e5f0;border-radius:13px;background:#f7fbff;color:#17324b;cursor:pointer}.usuario-avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#1687e8,#20a7ff);color:#fff;font-size:18px;font-weight:800}.usuario-dados{min-width:0;flex:1;text-align:left}.usuario-dados strong,.usuario-dados small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.usuario-dados strong{max-width:130px;font-size:13px}.usuario-dados small{margin-top:2px;color:#2f8d55;font-size:11px;font-weight:700}.usuario-seta{font-size:11px;color:#668198;transition:.2s}.usuario-area.aberto .usuario-seta{transform:rotate(180deg)}
    .usuario-menu{position:absolute;top:calc(100% + 9px);right:0;width:270px;display:none;overflow:hidden;border:1px solid #d9e5ef;border-radius:15px;background:#fff;box-shadow:0 18px 42px rgba(0,0,0,.19)}.usuario-area.aberto .usuario-menu{display:block}.usuario-menu-cabecalho{padding:16px;border-bottom:1px solid #e6eef5;background:#f7fbff}.usuario-menu-cabecalho strong,.usuario-menu-cabecalho span{display:block;overflow-wrap:anywhere}.usuario-menu-cabecalho strong{color:#123f66;font-size:14px}.usuario-menu-cabecalho span{margin-top:5px;color:#71879a;font-size:12px}
    .usuario-menu-opcao{width:100%;padding:13px 16px;display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid #eef3f7;background:#fff;color:#284b68;font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}.usuario-menu-opcao:hover{background:#f2f8fd}.usuario-menu-opcao.sair-menu{color:#c53d52;border-bottom:0}
    .aviso-topo{max-width:1180px;margin:-8px auto 18px;padding:11px 14px;display:none;border-radius:12px;background:#eaf6ff;color:#17527e;font-size:13px;font-weight:700}.aviso-topo.mostrar{display:block}
    @media(max-width:620px){.barra-superior{padding:10px 11px}.marca-topo small{display:none}.marca-topo strong{font-size:14px}.marca-topo img{width:36px;height:36px}.usuario-botao{min-width:0;padding:6px;border-radius:50%}.usuario-avatar{width:36px;height:36px}.usuario-dados,.usuario-seta{display:none}.usuario-menu{position:fixed;top:68px;right:12px;left:12px;width:auto}}

  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo-area">
      <img src="logo.jpg" alt="Logo Óticas Ventura">
    </div>

    <div class="menu">
      <button class="ativo" onclick="window.location.href='dashboard.html'">🏠 Início</button>
      <button onclick="abrirModulo('clientes.html')">👥 Clientes</button>
      <button onclick="abrirModulo('pedidos.html')">📦 Pedidos</button>
      <button onclick="abrirModulo('financeiro.html')">💰 Financeiro</button>
      <button onclick="abrirModulo('caixa.html')">💳 Caixa</button>
      <button onclick="abrirModulo('historico.html')">📊 Histórico</button>
      <button onclick="abrirModulo('os.html')">📋 Ordem de Serviço</button>
      <button onclick="abrirModulo('receituario.html')">📄 Receituário</button>
      <button onclick="abrirModulo('pupilometro.html')">👁 Pupilômetro Digital</button>
      <button onclick="abrirModulo('config.html')">⚙️ Configurações</button>
      <button id="btnSairTopo" class="sair" onclick="logout()">🚪 Sair</button>
    </div>

  </aside>

  <main class="painel-conteudo">

    <header class="barra-superior">
      <div class="marca-topo">
        <img src="logo.jpg" alt="Logo Óticas Ventura">
        <div><strong>Ventura System</strong><small>Sistema de Gestão Óticas Ventura</small></div>
      </div>
      <div class="usuario-area" id="usuarioArea">
        <button type="button" class="usuario-botao" id="usuarioBotao" onclick="alternarMenuUsuario(event)">
          <span class="usuario-avatar" id="usuarioAvatar">U</span>
          <span class="usuario-dados"><strong id="usuarioNomeTopo">Carregando...</strong><small>● Administrador</small></span>
          <span class="usuario-seta">▼</span>
        </button>
        <div class="usuario-menu">
          <div class="usuario-menu-cabecalho"><strong id="usuarioNomeMenu">Usuário</strong><span id="usuarioEmailMenu">Carregando...</span></div>
          <button type="button" class="usuario-menu-opcao" onclick="mostrarPerfil()">👤 Meu perfil</button>
          <button type="button" class="usuario-menu-opcao" onclick="alterarSenha()">🔐 Alterar senha</button>
          <button type="button" class="usuario-menu-opcao" onclick="sobreSistema()">ℹ️ Sobre o Ventura System</button>
          <button type="button" class="usuario-menu-opcao sair-menu" onclick="logout()">🚪 Sair</button>
        </div>
      </div>
    </header>
    <div class="aviso-topo" id="avisoTopo"></div>

    <div class="dashboard-home">

      <header class="painel-topo">
        <h1>Painel Ventura</h1>
        <p>Bem-vindo ao sistema da Óticas Ventura</p>
      </header>

      <section class="dashboard-cards">

        <div class="card">
          <span class="rotulo">👥 Clientes cadastrados</span>
          <span class="valor" id="totalClientes">0</span>
        </div>

        <div class="card">
          <span class="rotulo">📦 Pedidos cadastrados</span>
          <span class="valor" id="totalPedidos">0</span>
        </div>

        <div class="card">
          <span class="rotulo">💰 Total financeiro</span>
          <span class="valor">R$ <span id="totalFinanceiro">0</span></span>
        </div>

      </section>

      <section class="graficos-container">

        <div class="grafico-box">
          <h2>Clientes e pedidos</h2>
          <canvas id="graficoVendas" width="400" height="250"></canvas>
        </div>

        <div class="grafico-box">
          <h2>Financeiro</h2>
          <canvas id="graficoFinanceiro" width="400" height="250"></canvas>
        </div>

      </section>

    </div>

    <iframe id="moduloFrame" class="modulo-frame" title="Módulo do sistema"></iframe>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js?v=4"></script>

  <script>
    function ajustarAlturaFrame() {
      const frame = document.getElementById("moduloFrame");

      try {
        const documento = frame.contentDocument || frame.contentWindow.document;

        if (!documento) return;

        const altura = Math.max(
          documento.body ? documento.body.scrollHeight : 0,
          documento.documentElement ? documento.documentElement.scrollHeight : 0,
          760
        );

        frame.style.height = (altura + 30) + "px";
      } catch (erro) {
        frame.style.height = "900px";
      }
    }

    function abrirModulo(pagina) {
      const home = document.querySelector(".dashboard-home");
      const frame = document.getElementById("moduloFrame");

      if (home) {
        home.style.display = "none";
      }

      frame.style.display = "block";
      frame.style.height = "900px";

      frame.onload = function () {
        ajustarAlturaFrame();

        setTimeout(ajustarAlturaFrame, 300);
        setTimeout(ajustarAlturaFrame, 1000);
      };

      frame.src = pagina;

      document.querySelectorAll(".menu button").forEach(function(botao) {
        botao.classList.remove("ativo");
      });

      document.querySelectorAll(".menu button").forEach(function(botao) {
        const acao = botao.getAttribute("onclick") || "";

        if (acao.indexOf("'" + pagina + "'") !== -1) {
          botao.classList.add("ativo");
        }
      });

      window.scrollTo(0, 0);
    }

    window.addEventListener("resize", ajustarAlturaFrame);
  </script>

  <script>
    function nomeAmigavelUsuario(usuario){
      if(usuario&&usuario.displayName&&usuario.displayName.trim()) return usuario.displayName.trim();
      const email=usuario&&usuario.email?usuario.email:"Usuário";
      return email.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g,function(l){return l.toUpperCase();})||"Usuário";
    }
    function alternarMenuUsuario(e){if(e)e.stopPropagation();document.getElementById("usuarioArea").classList.toggle("aberto");}
    function fecharMenuUsuario(){document.getElementById("usuarioArea").classList.remove("aberto");}
    function mostrarAvisoTopo(msg){const a=document.getElementById("avisoTopo");a.textContent=msg;a.classList.add("mostrar");setTimeout(function(){a.classList.remove("mostrar");},5000);}
    function mostrarPerfil(){fecharMenuUsuario();const u=firebase.auth().currentUser;if(!u)return;alert("Meu perfil\n\nNome: "+nomeAmigavelUsuario(u)+"\nE-mail: "+(u.email||"Não disponível")+"\nCargo: Administrador");}
    function alterarSenha(){fecharMenuUsuario();const u=firebase.auth().currentUser;if(!u||!u.email)return;if(!confirm("Enviar um e-mail para redefinir a senha de "+u.email+"?"))return;firebase.auth().sendPasswordResetEmail(u.email).then(function(){mostrarAvisoTopo("E-mail de alteração de senha enviado com sucesso.");}).catch(function(){mostrarAvisoTopo("Não foi possível enviar o e-mail agora.");});}
    function sobreSistema(){fecharMenuUsuario();alert("Ventura System\n\nSistema de gestão da Óticas Ventura.\nVersão 1.0");}
    document.addEventListener("click",function(e){const a=document.getElementById("usuarioArea");if(a&&!a.contains(e.target))fecharMenuUsuario();});
    firebase.auth().onAuthStateChanged(function(u){if(!u)return;const n=nomeAmigavelUsuario(u);document.getElementById("usuarioNomeTopo").textContent=n;document.getElementById("usuarioNomeMenu").textContent=n;document.getElementById("usuarioEmailMenu").textContent=u.email||"";document.getElementById("usuarioAvatar").textContent=n.charAt(0).toUpperCase();});
  </script>

</body>
</html>
