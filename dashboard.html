<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Painel Ventura</title>
</head>
<body>
<div class="sidebar">
  <div style="text-align:center; margin-bottom:8px; padding-top:10px;">
  <img src="logo.jpg" width="75" style="border-radius:50%; display:block; margin:auto;">
</div>
  <button onclick="window.location.href='dashboard.html'">🏠 Início</button>
<button onclick="window.location.href='clientes.html'">👥 Clientes</button>
<button onclick="window.location.href='pedidos.html'">📦 Pedidos</button>
<button onclick="window.location.href='financeiro.html'">💰 Financeiro</button>
  <button onclick="window.location.href='caixa.html'">💵 Caixa</button>
  <button onclick="window.location.href='historico.html'">📊 Histórico</button>
<button onclick="window.location.href='os.html'">📋 Ordem de Serviço</button>
<button onclick="window.location.href='receituario.html'">📝 Receituário</button>
  <button onclick="window.location.href='config.html'">⚙️ Configurações</button>
<button onclick="logout()">🚪 Sair</button>
</div>
<h1 style="color:white; font-size:42px; font-weight:bold; text-shadow:0 4px 12px rgba(0,0,0,0.3);">
  Painel Ventura
</h1>

<p style="color:#222; background:white; padding:12px 20px; border-radius:16px; display:inline-block;">
  Bem-vindo ao sistema da Óticas Ventura
</p>
<div class="dashboard-cards">
  <div class="card">
    👥 Clientes<br>
    <span id="totalClientes">0</span>
  </div>

  <div class="card">
    📦 Pedidos<br>
    <span id="totalPedidos">0</span>
  </div>

  <div class="card">
    💰 Financeiro<br>
    R$ <span id="totalFinanceiro">0</span>
  </div>
</div>

<div class="graficos-container">
  <div class="grafico-box">
    <h2>Clientes e Pedidos</h2>
    <canvas id="graficoVendas" width="400" height="250"></canvas>
  </div>

  <div class="grafico-box">
    <h2>Financeiro</h2>
    <canvas id="graficoFinanceiro" width="400" height="250"></canvas>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js?v=4"></script>

</html>
