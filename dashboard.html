<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Painel Ventura</title>
</head>
<body>
  
<div class="sidebar">
  <div style="text-align:center; margin-bottom:8px; padding-top:10px;">
  <img src="logo.jpg" width="75" style="border-radius:50%; display:block; margin:auto;">
</div>
  <button onclick="window.location.href='dashboard.html'">🏠 Início</button>
<button onclick="abrirModulo('clientes.html')">👥 Clientes</button>
<button onclick="abrirModulo('pedidos.html')">📦 Pedidos</button>
<button onclick="abrirModulo('financeiro.html')">💰 Financeiro</button>
<button onclick="abrirModulo('caixa.html')">💳 Caixa</button>
<button onclick="abrirModulo('historico.html')">📊 Histórico</button>
<button onclick="abrirModulo('os.html')">📋 Ordem de Serviço</button>
<button onclick="abrirModulo('receituario.html')">📄 Receituário</button>
  <button onclick="abrirModulo('pupilometro.html')">👁 Pupilômetro Digital</button>
<button onclick="abrirModulo('config.html')">⚙️ Configurações</button>
  <button id="btnSairTopo" onclick="logout()">🚪 Sair</button>

</div>
  <div style="margin-top:-25px;">
<h1 style="color:white; font-size:52px; font-weight:700; margin-bottom:15px; text-shadow:0 6px 20px rgba(0,0,0,.35);">
    Painel Ventura
</h1>

<p style="color:#063b78; background:white; padding:14px 24px; border-radius:18px; display:inline-block; font-size:18px; font-weight:600;">
  Bem-vindo ao sistema da Óticas Ventura
</p>
    </div>
<div class="dashboard-cards">
  <div class="card">
    👥 Clientes<br>
    <span id="totalClientes">0</span>
  </div>

  <div class="card">
    📦 Pedidos<br>
    <span id="totalPedidos">0</span>
  </div>

  <div class="card">
    💰 Financeiro<br>
    R$ <span id="totalFinanceiro">0</span>
  </div>
</div>

<div class="graficos-container">
 <div class="grafico-box">
    <h2>Clientes e Pedidos</h2>
    <canvas id="graficoVendas" width="400" height="250"></canvas>
  </div>

  <div class="grafico-box">
    <h2>Financeiro</h2>
    <canvas id="graficoFinanceiro" width="400" height="250"></canvas>
  </div>
</div>
  <iframe id="moduloFrame" class="modulo-frame" title="Módulo do sistema"></iframe>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js?v=4"></script>
  <script>
function abrirModulo(pagina) {
      const home = document.querySelector(".dashboard-home");
      const frame = document.getElementById("moduloFrame");

      if (home) home.style.display = "none";

      frame.src = pagina;
      frame.style.display = "block";

      document.querySelectorAll(".menu button").forEach(botao => {
        botao.classList.remove("ativo");
      });

      const botaoAtual = Array.from(document.querySelectorAll(".menu button"))
        .find(botao => botao.getAttribute("onclick")?.includes("'" + pagina + "'"));

      if (botaoAtual) botaoAtual.classList.add("ativo");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
