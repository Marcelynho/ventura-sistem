<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Caixa - Óticas Ventura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-caixa">

<h1>Caixa</h1>

<h2>Abrir Caixa</h2>
<input id="valorInicialCaixa" placeholder="Valor inicial">
<input id="funcionarioCaixa" placeholder="Funcionário">
<button onclick="abrirCaixa()">Abrir Caixa</button>

<hr>

<h2>Movimentação</h2>
<input id="descricaoMovimento" placeholder="Descrição">
<input id="valorMovimento" placeholder="Valor">
<select id="tipoMovimento">
  <option value="entrada">Entrada</option>
  <option value="saida">Saída</option>
</select>
<button onclick="registrarMovimento()">Registrar</button>

<hr>

<h2>Fechar Caixa</h2>
<input id="valorConferidoCaixa" placeholder="Valor conferido">
<button onclick="fecharCaixa()">Fechar Caixa</button>

<hr>

<h2>Resumo do Caixa</h2>
<div id="resumoCaixa">
  <div class="linha-resumo">Valor inicial: R$ <span id="resumoInicial">0</span></div>
<div class="linha-resumo">Entradas: R$ <span id="resumoEntradas">0</span></div>
<div class="linha-resumo">Saídas: R$ <span id="resumoSaidas">0</span></div>
<div class="linha-resumo">Saldo esperado: R$ <span id="resumoSaldo">0</span></div>
<div class="linha-resumo">Valor conferido: R$ <span id="resumoConferido">0</span></div>
<div class="linha-resumo">Diferença: R$ <span id="resumoDiferenca">0</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>

</body>
</html>
