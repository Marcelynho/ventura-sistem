<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Configurações</title>
</head>
<body>

<div class="sidebar">
  <div style="text-align:center; margin-bottom:8px; padding-top:10px;">
    <img src="logo.jpg" width="75" style="border-radius:50%; display:block; margin:auto;">
  </div>

  <button onclick="window.location.href='dashboard.html'">🏠 Início</button>
  <button onclick="window.location.href='clientes.html'">👥 Clientes</button>
  <button onclick="window.location.href='pedidos.html'">📦 Pedidos</button>
  <button onclick="window.location.href='financeiro.html'">💰 Financeiro</button>
  <button onclick="window.location.href='caixa.html'">💵 Caixa</button>
  <button onclick="window.location.href='historico.html'">📊 Histórico</button>
  <button onclick="window.location.href='os.html'">📋 Ordem de Serviço</button>
  <button onclick="window.location.href='receituario.html'">📄 Receituário</button>
  <button onclick="window.location.href='config.html'">⚙️ Configurações</button>
  <button onclick="logout()">🚪 Sair</button>
</div>

<h1 style="color:white; font-size:42px; font-weight:bold; text-shadow:0 4px 12px rgba(0,0,0,0.3);">
  Configurações
</h1>

<div class="form-box">
  <h2>Dados da Loja</h2>
  <button onclick="fazerBackup()">💾 Fazer Backup</button>
  <input type="file" id="arquivoBackup" accept=".json" style="display:none">

<button onclick="document.getElementById('arquivoBackup').click()">
📂 Restaurar Backup
</button>

<p id="statusBackup"></p>

  <input id="nomeLoja" placeholder="Nome da loja"><br><br>
  <input id="telefoneLoja" placeholder="WhatsApp da loja"><br><br>
  <input id="enderecoLoja" placeholder="Endereço"><br><br>
  <input id="cidadeLoja" placeholder="Cidade"><br><br>

  <button onclick="salvarConfig()">Salvar Configurações</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script> 
  <script src="app.js"></script>
<script>
  
function salvarConfig() {
  const config = {
    nomeLoja: document.getElementById("nomeLoja").value,
    telefoneLoja: document.getElementById("telefoneLoja").value,
    enderecoLoja: document.getElementById("enderecoLoja").value,
    cidadeLoja: document.getElementById("cidadeLoja").value
  };

  localStorage.setItem("configLoja", JSON.stringify(config));
  alert("Configurações salvas com sucesso!");
}
async function buscarColecaoBackup(nome) {
    const snap = await db.collection(nome).get();
    let dados = [];

    snap.forEach(doc => {
        dados.push({
            id: doc.id,
            ...doc.data()
        });
    });

    return dados;
}
function esperarLogin() {
  return new Promise((resolve) => {
    firebase.auth().onAuthStateChanged((user) => {
      resolve(user);
    });
  });
}
async function fazerBackup() {
    const status = document.getElementById("statusBackup");

    status.innerHTML = "⏳ Gerando backup...";
  const user = await esperarLogin();

if (!user) {
  status.innerHTML = "⚠️ Faça login primeiro.";
  return;
}

    try {

        const backup = {
            clientes: await buscarColecaoBackup("clientes"),
            pedidos: await buscarColecaoBackup("pedidos"),
            ordens: await buscarColecaoBackup("ordens"),
            financeiro: await buscarColecaoBackup("financeiro"),
            caixas: await buscarColecaoBackup("caixas"),
            historicoCaixa: await buscarColecaoBackup("historicoCaixa"),
            receituarios: await buscarColecaoBackup("receituarios"),
            notas_fiscais: await buscarColecaoBackup("notas_fiscais")
        };

        const arquivo = new Blob(
            [JSON.stringify(backup, null, 2)],
            { type: "application/json" }
        );

        const link = document.createElement("a");
        link.href = URL.createObjectURL(arquivo);
        link.download = "ventura-backup.json";
        link.click();

        status.innerHTML = "✅ Backup criado com sucesso.";

    } catch (e) {

        console.error(e);
        status.innerHTML = "❌ " + e.message;

    }
}
window.onload = function () {
  const config = JSON.parse(localStorage.getItem("configLoja"));

  if (!config) return;

  document.getElementById("nomeLoja").value = config.nomeLoja || "";
  document.getElementById("telefoneLoja").value = config.telefoneLoja || "";
  document.getElementById("enderecoLoja").value = config.enderecoLoja || "";
  document.getElementById("cidadeLoja").value = config.cidadeLoja || "";
  };
  document.getElementById("arquivoBackup").addEventListener("change", restaurarBackup);

async function restaurarBackup(event) {
  const status = document.getElementById("statusBackup");
  const arquivo = event.target.files[0];

  if (!arquivo) return;

  const confirmar = confirm(
    "ATENÇÃO: restaurar backup pode sobrescrever dados atuais. Deseja continuar?"
  );

  if (!confirmar) {
    status.innerHTML = "⚠️ Restauração cancelada.";
    return;
  }

  status.innerHTML = "⏳ Restaurando backup... aguarde.";

  try {
    const texto = await arquivo.text();
    const backup = JSON.parse(texto);

    async function restaurarColecao(nome, dados) {
      if (!Array.isArray(dados)) return;

      for (const item of dados) {
        const id = item.id;
        const copia = { ...item };
        delete copia.id;

        if (id) {
          await db.collection(nome).doc(id).set(copia);
        }
      }
    }

    await restaurarColecao("clientes", backup.clientes);
    await restaurarColecao("pedidos", backup.pedidos);
    await restaurarColecao("ordens", backup.ordens);
    await restaurarColecao("caixas", backup.caixas);
    await restaurarColecao("financeiro", backup.financeiro);
    await restaurarColecao("historicoCaixa", backup.historicoCaixa);
    await restaurarColecao("notas_fiscais", backup.notas_fiscais);
    await restaurarColecao("receituarios", backup.receituarios);

    status.innerHTML = "✅ Backup restaurado com sucesso.";
    alert("Backup restaurado com sucesso!");
  } catch (e) {
    console.error(e);
    status.innerHTML = "❌ Erro ao restaurar backup: " + e.message;
  }
}

</script>
</body>
</html>
