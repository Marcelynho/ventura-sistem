<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Clientes</title>
</head>
<body>
  <div class="sidebar">
    <h2>Óticas Ventura</h2>
    <button onclick="window.location.href='dashboard.html'">Inicio</button>
    <button>Clientes</button>
    <button onclick="window.location.href='pedidos.html'">Pedidos</button>
    <button onclick="window.location.href='financeiro.html'">Financeiro</button>
    <button onclick="window.location.href='index.html'">Sair</button>
</div>
<div class="form-box">
  <h1>Cadastro de Clientes</h1>
<input id="buscarCliente" type="text" placeholder="Buscar cliente por nome ou telefone"><br><br>
  <br><br>

<button onclick="filtroStatus='todos'; mostrarClientes()">Todos</button>

<button id="btnVencidos" onclick="filtroStatus='vencido'; mostrarClientes()">
  🔴 Vencidos
</button>

<button id="btnHoje" onclick="filtroStatus='hoje'; mostrarClientes()">
  🟡 Vence hoje
</button>

<button onclick="filtroStatus='sem'; mostrarClientes()">
  ⚪ Sem retorno
</button>

<button onclick="filtroStatus='prazo'; mostrarClientes()">
  🟢 No prazo
</button>

<br><br>
  <input id="nomeCliente" type="text" placeholder="Nome do cliente"><br><br>

<input id="telefoneCliente" type="text" placeholder="Telefone"><br><br>
<input id="cpfCliente" type="text" placeholder="CPF"><br><br>

<input id="cepCliente" type="text" placeholder="CEP"><br><br>
<input id="enderecoCliente" type="text" placeholder="Endereço"><br><br>
<input id="bairroCliente" type="text" placeholder="Bairro"><br><br>
<input id="cidadeCliente" type="text" placeholder="Cidade"><br><br>
<input id="nascimentoCliente" type="date"><br><br>

<textarea id="obsCliente" placeholder="Observações"></textarea><br><br>

<button class="btn-salvar" onclick="salvarCliente()">Salvar Cliente</button>

<h2>Clientes cadastrados</h2>

<div class="cards-resumo">
  <div>Total: <span id="totalClientes">0</span></div>
  <div>🔴 Vencidos: <span id="totalVencidosCard">0</span></div>
  <div>🟡 Hoje: <span id="totalHojeCard">0</span></div>
  <div>⚪ Sem retorno: <span id="totalSemCard">0</span></div>
  <div>🟢 No prazo: <span id="totalPrazoCard">0</span></div>
</div>

<br>

<input
  type="text"
  id="buscaCliente"
  placeholder="Buscar por nome ou telefone"
  onkeyup="mostrarClientes()"
>

<br><br>

<table id="listaClientes">
  <tr>
    <th>Nome</th>
    <th>Telefone</th>
    <th>Endereço</th>
<th>Bairro</th>
<th>Cidade</th>
    <th>Retorno</th>
    <th>Status</th>
    <th>Ações</th>
  </tr>
</table>
</div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
