<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clientes - Óticas Ventura</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(52, 151, 235, 0.18), transparent 28%),
        linear-gradient(135deg, #062449, #0b4c86);
      color: #17324b;
    }

    body {
      padding: 28px;
    }

    .clientes-wrapper {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    }

    .clientes-topo {
      padding: 26px 30px;
      color: #ffffff;
      background: linear-gradient(135deg, #082b54, #0d5d9f);
    }

    .clientes-topo h1 {
      margin: 0;
      font-size: 34px;
      color: #ffffff;
    }

    .clientes-conteudo {
      padding: 28px 30px 32px;
      background: #ffffff;
    }

    .secao {
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid #d9e5ef;
      border-radius: 16px;
      background: #f8fbfe;
      opacity: 1;
    }

    .secao h2 {
      margin: 0 0 16px;
      color: #0d4d84;
      font-size: 20px;
    }

    .grade {
      display: grid;
      gap: 14px;
    }

    .grade-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grade-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid #cfdce8;
      border-radius: 10px;
      background: #ffffff;
      color: #18334d;
      opacity: 1;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #6c8194;
      opacity: 1;
    }

    input:focus,
    textarea:focus {
      border-color: #1a84d8;
      box-shadow: 0 0 0 3px rgba(26, 132, 216, 0.12);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      color: #ffffff;
      background: #1687e8;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn-salvar {
      background: #239a55;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .linha-busca {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }

    .acoes-formulario {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .cards-resumo > div {
      padding: 14px;
      border: 1px solid #d7e3ee;
      border-radius: 12px;
      background: #ffffff;
      color: #18334d;
      font-weight: 700;
      text-align: center;
    }

    .tabela-wrapper {
      width: 100%;
      max-width: 100%;
      margin-top: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid #d9e5ef;
      border-radius: 12px;
      background: #ffffff;
    }

    table {
      width: 100%;
      min-width: 820px;
      table-layout: fixed;
      border-collapse: collapse;
      background: #ffffff;
      color: #17324b;
      opacity: 1;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e3ebf2;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #listaClientes th:nth-child(1),
    #listaClientes td:nth-child(1) { width: 15%; }

    #listaClientes th:nth-child(2),
    #listaClientes td:nth-child(2) { width: 13%; }

    #listaClientes th:nth-child(3),
    #listaClientes td:nth-child(3) { width: 18%; }

    #listaClientes th:nth-child(4),
    #listaClientes td:nth-child(4) { width: 11%; }

    #listaClientes th:nth-child(5),
    #listaClientes td:nth-child(5) { width: 11%; }

    #listaClientes th:nth-child(6),
    #listaClientes td:nth-child(6) { width: 11%; }

    #listaClientes th:nth-child(7),
    #listaClientes td:nth-child(7) { width: 10%; }

    #listaClientes th:nth-child(8),
    #listaClientes td:nth-child(8) {
      width: 120px;
      min-width: 120px;
      white-space: normal;
    }

    #listaClientes td:nth-child(8) button,
    #listaClientes td:nth-child(8) a {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 4px 0;
      padding: 8px 6px;
      border-radius: 8px;
      text-align: center;
      white-space: normal;
      font-size: 12px;
    }

    th {
      background: #0d5d9f;
      color: #ffffff;
      white-space: nowrap;
    }

    tr:nth-child(even) td {
      background: #f7fafc;
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .clientes-topo {
        padding: 22px 18px;
      }

      .clientes-topo h1 {
        font-size: 28px;
      }

      .clientes-conteudo {
        padding: 20px 16px 24px;
      }

      .grade-2,
      .grade-4,
      .cards-resumo {
        grid-template-columns: 1fr;
      }

      .acoes-formulario button,
      .filtros button {
        width: 100%;
      }

      table {
        min-width: 760px;
      }

      #listaClientes td:nth-child(8) button,
      #listaClientes td:nth-child(8) a {
        font-size: 11px;
        padding: 7px 5px;
      }
    }
  
    /* Visualização compacta da lista dentro do painel */
    #listaClientes th:nth-child(3),
    #listaClientes td:nth-child(3),
    #listaClientes th:nth-child(4),
    #listaClientes td:nth-child(4),
    #listaClientes th:nth-child(5),
    #listaClientes td:nth-child(5) {
      display: none;
    }

    #listaClientes {
      min-width: 560px;
      table-layout: fixed;
    }

    #listaClientes th:nth-child(1),
    #listaClientes td:nth-child(1) { width: 25%; }

    #listaClientes th:nth-child(2),
    #listaClientes td:nth-child(2) { width: 20%; }

    #listaClientes th:nth-child(6),
    #listaClientes td:nth-child(6) { width: 17%; }

    #listaClientes th:nth-child(7),
    #listaClientes td:nth-child(7) { width: 16%; }

    #listaClientes th:nth-child(8),
    #listaClientes td:nth-child(8) {
      width: 130px;
      min-width: 130px;
    }

    @media (max-width: 700px) {
      #listaClientes {
        min-width: 520px;
      }
    }

  </style>
</head>

<body>

  <main class="clientes-wrapper">

    <header class="clientes-topo">
      <h1>👥 Cadastro de Clientes</h1>
    </header>

    <div class="clientes-conteudo">

      <section class="secao">
        <h2>Buscar cliente</h2>

        <div class="linha-busca">
          <input
            id="buscarCliente"
            type="text"
            placeholder="Buscar cliente por nome ou telefone"
          >
        </div>

        <div class="filtros" style="margin-top:14px;">
          <button type="button" onclick="filtroStatus='todos'; mostrarClientes()">Todos</button>

          <button type="button" id="btnVencidos" onclick="filtroStatus='vencido'; mostrarClientes()">
            🔴 Vencidos
          </button>

          <button type="button" id="btnHoje" onclick="filtroStatus='hoje'; mostrarClientes()">
            🟡 Vence hoje
          </button>

          <button type="button" onclick="filtroStatus='sem'; mostrarClientes()">
            ⚪ Sem retorno
          </button>

          <button type="button" onclick="filtroStatus='prazo'; mostrarClientes()">
            🟢 No prazo
          </button>
        </div>
      </section>

      <section class="secao">
        <h2>Dados do cliente</h2>

        <div class="grade grade-4">
          <input id="nomeCliente" type="text" placeholder="Nome do cliente">
          <input id="telefoneCliente" type="text" placeholder="Telefone">
          <input id="cpfCliente" type="text" placeholder="CPF">
          <input id="nascimentoCliente" type="date">
        </div>

        <div class="grade grade-4" style="margin-top:14px;">
          <input id="cepCliente" type="text" placeholder="CEP">
          <input id="enderecoCliente" type="text" placeholder="Endereço">
          <input id="bairroCliente" type="text" placeholder="Bairro">
          <input id="cidadeCliente" type="text" placeholder="Cidade">
        </div>

        <div style="margin-top:14px;">
          <textarea id="obsCliente" placeholder="Observações"></textarea>
        </div>

        <div class="acoes-formulario">
          <button type="button" class="btn-salvar" onclick="salvarCliente()">
            💾 Salvar cliente
          </button>
        </div>
      </section>

      <section class="secao">
        <h2>Clientes cadastrados</h2>

        <div class="cards-resumo">
          <div>Total: <span id="totalClientes">0</span></div>
          <div>🔴 Vencidos: <span id="totalVencidosCard">0</span></div>
          <div>🟡 Hoje: <span id="totalHojeCard">0</span></div>
          <div>⚪ Sem retorno: <span id="totalSemCard">0</span></div>
          <div>🟢 No prazo: <span id="totalPrazoCard">0</span></div>
        </div>

        <input
          type="text"
          id="buscaCliente"
          placeholder="Buscar por nome ou telefone"
          onkeyup="mostrarClientes()"
        >

        <div class="tabela-wrapper">
          <table id="listaClientes">
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Endereço</th>
              <th>Bairro</th>
              <th>Cidade</th>
              <th>Retorno</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </table>
        </div>
      </section>

    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

</body>
</html>
