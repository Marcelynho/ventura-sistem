<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Backup Ventura System</title>
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Arial;background:#f5f7fb;text-align:center;padding:40px}
.card{max-width:700px;margin:auto;background:white;padding:40px;border-radius:12px;box-shadow:0 0 15px #0003}
button{background:#1565c0;color:white;border:none;padding:15px 35px;font-size:18px;border-radius:8px;cursor:pointer}
h1{color:#1565c0}
</style>
</head>
<body>

<div class="card">
<h1>💾 Backup Ventura System</h1>
<p>Exporta todos os dados do Firebase para um arquivo JSON.</p>
<button onclick="fazerBackup()">Fazer Backup</button>
<p id="status"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDkKbihoymG4PyZlZWsKnXtn6xqhZumbNk",
  authDomain: "ventura-system.firebaseapp.com",
  projectId: "ventura-system",
  storageBucket: "ventura-system.firebasestorage.app",
  messagingSenderId: "302438886661",
  appId: "1:302438886661:web:8c5ce0f51c9a71e4e35b6c"
};

firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

auth.onAuthStateChanged((user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});
const db = firebase.firestore();

async function buscarColecao(nome) {
  try {
    console.log("Lendo coleção:", nome);

    const snap = await db.collection(nome).get();
    const dados = [];

    snap.forEach(doc => {
      dados.push({
        id: doc.id,
        ...doc.data()
      });
    });

    return dados;
  } catch (erro) {
    console.error("Erro na coleção:", nome, erro);
    throw erro;
  }
}

async function fazerBackup() {
  const status = document.getElementById("status");
  status.innerHTML = "Gerando backup... aguarde.";

  try {
    const backup = {
      dataBackup: new Date().toISOString(),
      sistema: "Ventura System",
      clientes: await buscarColecao("clientes"),
      pedidos: await buscarColecao("pedidos"),
      ordens: await buscarColecao("ordens"),
      caixas: await buscarColecao("caixas"),
      financeiro: await buscarColecao("financeiro"),
      historicoCaixa: await buscarColecao("historicoCaixa"),
      notas_fiscais: await buscarColecao("notas_fiscais"),
      receituarios: await buscarColecao("receituarios")
    };

    const arquivo = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const link = document.createElement("a");
    link.href = URL.createObjectURL(arquivo);
    link.download = "ventura-backup-" + new Date().toISOString().slice(0,10) + ".json";
    link.click();

    status.innerHTML = "✅ Backup gerado com sucesso.";
  } catch (erro) {
    console.error(erro);
    status.innerHTML = "❌ Erro ao gerar backup.";
  }
}
</script>

</body>
</html>
