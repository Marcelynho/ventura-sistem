<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Backup Ventura System</title>
</head>
<body style="font-family:Arial;background:#f5f7fb;text-align:center;padding:40px;">

<div style="max-width:700px;margin:auto;background:white;padding:35px;border-radius:14px;box-shadow:0 0 15px #0002;">
  <h1>💾 Backup Ventura System</h1>
  <p>Entre primeiro no sistema, depois gere o backup.</p>

  <button onclick="fazerBackup()" style="background:#00a651;color:white;border:0;padding:14px 35px;border-radius:8px;cursor:pointer;">
    Fazer Backup
  </button>

  <p id="status">Verificando login...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDkKbihoymG4pYz1ZWSknXtn6xqhZumbNk",
  authDomain: "ventura-system.firebaseapp.com",
  projectId: "ventura-system",
  storageBucket: "ventura-system.firebasestorage.app",
  messagingSenderId: "302438886661",
  appId: "1:302438886661:web:8c5ce0f51c9a71e4e35b6c"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

function statusMsg(msg) {
  document.getElementById("status").innerHTML = msg;
}

auth.onAuthStateChanged((user) => {
  if (user) {
    statusMsg("✅ Logado como: " + user.email + ". Pode fazer backup.");
  } else {
    statusMsg("⚠️ Você precisa entrar no sistema primeiro.");
  }
});

async function buscarColecao(nome) {
  const snap = await db.collection(nome).get();
  const dados = [];

  snap.forEach(doc => {
    dados.push({
      id: doc.id,
      ...doc.data()
    });
  });

  return dados;
}

async function fazerBackup() {
  const user = auth.currentUser;

  if (!user) {
    statusMsg("⚠️ Entre no sistema primeiro e depois volte aqui.");
    return;
  }

  statusMsg("⏳ Gerando backup... aguarde.");

  try {
    const backup = {
      dataBackup: new Date().toISOString(),
      usuario: user.email,
      sistema: "Ventura System",
      clientes: await buscarColecao("clientes"),
      pedidos: await buscarColecao("pedidos"),
      ordens: await buscarColecao("ordens"),
      caixas: await buscarColecao("caixas"),
      financeiro: await buscarColecao("financeiro"),
      historicoCaixa: await buscarColecao("historicoCaixa"),
      notas_fiscais: await buscarColecao("notas_fiscais"),
      receituarios: await buscarColecao("receituarios")
    };

    const arquivo = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const link = document.createElement("a");
    link.href = URL.createObjectURL(arquivo);
    link.download = "ventura-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    link.click();

    statusMsg("✅ Backup gerado com sucesso.");
  } catch (erro) {
    console.error(erro);
    statusMsg("❌ Erro ao gerar backup: " + erro.message);
  }
}
</script>

</body>
</html>
