<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ordem de Serviço</title>
</head>
<body>
  <h1>Óticas Ventura</h1>
<h2>Nova Ordem de Serviço</h2>

<input id="buscaClienteOS" placeholder="Buscar cliente por nome / telefone / CPF">
<button onclick="buscarClienteOS()">🔍 Buscar</button>

<br><br>

<h3>Dados do Cliente</h3>

<input id="numeroOS" placeholder="Nº da OS"><br><br>
<input id="clienteOS" placeholder="Nome"><br><br>
<input id="telefoneOS" placeholder="Telefone"><br><br>
<input id="cpfOS" placeholder="CPF"><br><br>
<input id="cepOS" placeholder="CEP"><br><br>
<input id="enderecoOS" placeholder="Endereço"><br><br>
<input id="bairroOS" placeholder="Bairro"><br><br>
<input id="cidadeOS" placeholder="Cidade"><br><br>

<h3>Produto / Pagamento</h3>

<input id="lenteOS" placeholder="Produto"><br><br>
<input id="valorOS" placeholder="Valor Total"><br><br>
<input id="entradaOS" placeholder="Entrada" oninput="calcularRestante()"><br><br>
<input id="restanteOS" placeholder="Restante"><br><br>
<select id="pagamentoOS">
  <option value="">Forma de Pagamento</option>
  <option value="Pix">Pix</option>
  <option value="Dinheiro">Dinheiro</option>
  <option value="Cartão de Crédito">Cartão de Crédito</option>
  <option value="Cartão de Débito">Cartão de Débito</option>
  <option value="Parcelado">Parcelado</option>
</select><br><br>
  <select id="parcelasCartao" style="display:none;">
  <option value="">Parcelamento</option>
  <option value="avista">À vista</option>
  <option value="1x">1x</option>
  <option value="2x">2x</option>
  <option value="3x">3x</option>
  <option value="4x">4x</option>
  <option value="5x">5x</option>
  <option value="6x">6x</option>
  <option value="7x">7x</option>
  <option value="8x">8x</option>
  <option value="9x">9x</option>
  <option value="10x">10x</option>
  <option value="11x">11x</option>
  <option value="12x">12x</option>
</select>
<h3>Dados do Exame</h3>

<input id="odEsferico" placeholder="OD Esférico">
<input id="odCilindrico" placeholder="OD Cilíndrico">
<input id="odEixo" placeholder="OD Eixo"><br><br>

<input id="oeEsferico" placeholder="OE Esférico">
<input id="oeCilindrico" placeholder="OE Cilíndrico">
<input id="oeEixo" placeholder="OE Eixo"><br><br>

<input id="dnpOS" placeholder="DNP">
<input id="alturaOS" placeholder="Altura">
<input id="addOS" placeholder="ADD"><br><br>

<button onclick="salvarOS()">Salvar OS</button>
<button onclick="imprimirOS()">Imprimir</button>
<button onclick="finalizarEEnviar()"
style="background:green; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">
📲 Finalizar + WhatsApp
</button>
  <button onclick="deletarOS()">Deletar OS</button>
  <button onclick="gerarNotaFiscalOS()">
  🧾 Gerar Nota Fiscal
</button>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js?v=5"></script>
  <hr>
<h3>Lista de OS</h3>
<button onclick="listarOS()">Atualizar Lista</button>
<div id="listaOS"></div>
  <script>
document.getElementById("pagamentoOS").addEventListener("change", function () {
  const parcelas = document.getElementById("parcelasCartao");

  if (this.value === "Cartão de Crédito") {
    parcelas.style.display = "block";
  } else {
    parcelas.style.display = "none";
    parcelas.value = "";
  }
});
</script>
</body>
</html>
