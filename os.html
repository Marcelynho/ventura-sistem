<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <title>Ordem de Serviço - Óticas Ventura</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(52, 151, 235, 0.18), transparent 28%),
        linear-gradient(135deg, #062449, #0b4c86);
      color: #16324c;
    }

    body {
      padding: 28px;
    }

    .os-wrapper {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .os-topo {
      padding: 26px 30px;
      color: #ffffff;
      background: linear-gradient(135deg, #082b54, #0d5d9f);
    }

    .os-topo h1 {
      margin: 0;
      font-size: 34px;
    }

    .os-topo p {
      margin: 7px 0 0;
      color: #d8ebfb;
    }

    .os-conteudo {
      padding: 28px 30px 32px;
    }

    .secao {
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid #d9e5ef;
      border-radius: 16px;
      background: #f8fbfe;
    }

    .secao h2 {
      margin: 0 0 16px;
      color: #0d4d84;
      font-size: 20px;
    }

    .linha-busca {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .grade {
      display: grid;
      gap: 14px;
    }

    .grade-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grade-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grade-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid #cfdce8;
      border-radius: 10px;
      background: #ffffff;
      color: #18334d;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #1a84d8;
      box-shadow: 0 0 0 3px rgba(26, 132, 216, 0.12);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      color: #ffffff;
      background: #1687e8;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn-verde {
      background: #239a55;
    }

    .btn-vermelho {
      background: #c62828;
    }

    .btn-cinza {
      background: #5c6f82;
    }

    .btn-roxo {
      background: #6f42c1;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .linha-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #listaOS {
      margin-top: 18px;
    }

    .campo-destaque {
      background: #eef7ff;
      border-color: #a9cfee;
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .os-conteudo {
        padding: 20px 16px 24px;
      }

      .os-topo {
        padding: 22px 18px;
      }

      .os-topo h1 {
        font-size: 28px;
      }

      .linha-busca,
      .grade-2,
      .grade-3,
      .grade-4 {
        grid-template-columns: 1fr;
      }

      .linha-busca button,
      .acoes button,
      .linha-lista button {
        width: 100%;
      }
    }

    @media print {
      body {
        padding: 0;
        background: #ffffff;
      }

      .os-wrapper {
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }

      .linha-busca,
      .acoes,
      .linha-lista,
      #listaOS {
        display: none !important;
      }
    }

    /* Lista de OS compacta e sem rolagem horizontal */
    .os-lista-item {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(430px, auto);
      gap: 14px;
      align-items: center;
      margin: 8px 0;
      padding: 12px 14px;
      border: 1px solid #d6e1eb;
      border-radius: 12px;
      background: #ffffff;
    }

    .os-lista-dados {
      min-width: 0;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .os-lista-acoes {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      min-width: 0;
    }

    .os-lista-acoes button,
    .os-lista-acoes select {
      width: auto;
      min-width: 0;
      height: 36px;
      margin: 0;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .os-lista-acoes select {
      max-width: 155px;
      border: 1px solid #cfdce8;
      background: #fff;
      color: #18334d;
    }

    .btn-os-editar { background: #d99a00; }
    .btn-os-receber { background: #21864a; }
    .btn-os-imprimir { background: #315fd1; }
    .btn-os-status { background: #1687e8; }
    .btn-os-deletar { background: #cf3c4d; }

    @media (max-width: 1080px) {
      .os-lista-item {
        grid-template-columns: 1fr;
      }

      .os-lista-acoes {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 620px) {
      .os-lista-acoes button,
      .os-lista-acoes select {
        flex: 1 1 140px;
        max-width: none;
      }
    }

  </style>
</head>

<body>

  <main class="os-wrapper">

    <header class="os-topo">
      <h1>🧾 Ordem de Serviço</h1>
      
    </header>

    <div class="os-conteudo">

      <section class="secao">
        <h2>Buscar cliente</h2>

        <div class="linha-busca">
          <input
            id="buscaClienteOS"
            type="text"
            placeholder="Buscar cliente por nome, telefone, CPF ou CNPJ"
          >

          <button type="button" onclick="buscarClienteOS()">
            🔍 Buscar
          </button>
        </div>
      </section>

      <section class="secao">
        <h2>Dados do cliente</h2>

        <div class="grade grade-4">
          <input id="numeroOS" class="campo-destaque" placeholder="Nº da OS">
          <input id="dataCompraOS" type="date">
          <input id="vendedorOS" placeholder="Vendedor">
          <input id="previsaoEntregaOS" type="date">
        </div>
        <div class="grade grade-4" style="margin-top:14px;">
          <input id="clienteOS" placeholder="Nome">
          <input id="telefoneOS" placeholder="Telefone">
          <input id="cpfOS" placeholder="CPF ou CNPJ">
          <select id="statusOS">
            <option>Recebido</option>
            <option>Em produção</option>
            <option>Enviado ao laboratório</option>
            <option>Pronto para retirada</option>
            <option>Entregue</option>
          </select>
        </div>

        <div class="grade grade-4" style="margin-top:14px;">
          <input id="emailOS" type="email" placeholder="E-mail do cliente">
          <input id="cepOS" placeholder="CEP">
          <input id="enderecoOS" placeholder="Rua / Endereço">
          <input id="numeroEnderecoOS" placeholder="Número">
        </div>

        <div class="grade grade-4" style="margin-top:14px;">
          <input id="complementoOS" placeholder="Complemento">
          <input id="bairroOS" placeholder="Bairro">
          <input id="cidadeOS" placeholder="Cidade">
          <input id="ufOS" maxlength="2" placeholder="UF">
        </div>
      </section>

      <section class="secao">
        <h2>Produto e pagamento</h2>

        <div class="grade grade-3">
          <input id="lenteOS" placeholder="Lente">
          <input id="armacaoOS" placeholder="Armação">
          <input id="valorOS" placeholder="Valor total">
        </div>

        <div class="grade grade-3" style="margin-top:14px;">
          <input
            id="entradaOS"
            placeholder="Entrada"
            oninput="calcularRestante()"
          >

          <input
            id="restanteOS"
            class="campo-destaque"
            placeholder="Restante"
          >

          <select id="pagamentoOS" onchange="mostrarParcelas()">
            <option value="">Forma de pagamento</option>
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Cartão de Débito">Cartão de Débito</option>
            <option value="Parcelado">Parcelado</option>
          </select>
        </div>

        <div class="grade grade-2" style="margin-top:14px;">
          <select id="parcelasCartao" style="display:none;">
            <option value="">Parcelamento</option>
            <option value="avista">À vista</option>
            <option value="1x">1x</option>
            <option value="2x">2x</option>
            <option value="3x">3x</option>
            <option value="4x">4x</option>
            <option value="5x">5x</option>
            <option value="6x">6x</option>
            <option value="7x">7x</option>
            <option value="8x">8x</option>
            <option value="9x">9x</option>
            <option value="10x">10x</option>
            <option value="11x">11x</option>
            <option value="12x">12x</option>
          </select>
        </div>
      </section>

      <section class="secao">
        <h2>Dados do exame</h2>

        <div class="grade grade-3">
          <input id="odEsferico" placeholder="OD Esférico">
          <input id="odCilindrico" placeholder="OD Cilíndrico">
          <input id="odEixo" placeholder="OD Eixo">
        </div>

        <div class="grade grade-3" style="margin-top:14px;">
          <input id="oeEsferico" placeholder="OE Esférico">
          <input id="oeCilindrico" placeholder="OE Cilíndrico">
          <input id="oeEixo" placeholder="OE Eixo">
        </div>

        <div class="grade grade-3" style="margin-top:14px;">
          <input id="dnpOS" placeholder="DNP">
          <input id="alturaOS" placeholder="Altura">
          <input id="addOS" placeholder="ADD">
        </div>
      </section>

      <section class="secao">
        <h2>Observações</h2>
        <textarea id="observacoesOS" placeholder="Observações" style="width:100%;min-height:90px;padding:12px;border:1px solid #cfdce8;border-radius:10px;font:inherit;"></textarea>
      </section>

      <section class="secao">
        <h2>Ações da OS</h2>

        <div class="acoes">
          <button type="button" class="btn-verde" onclick="salvarOS()">
            💾 Salvar OS
          </button>

          <button type="button" class="btn-cinza" onclick="imprimirOSCompleta()">🖨 Via da Loja</button>
          <button type="button" class="btn-roxo" onclick="imprimirOSCliente()">🧾 Via do Cliente</button>

          <button type="button" class="btn-verde" onclick="finalizarEEnviar()">
            📲 Finalizar + WhatsApp
          </button>

          <button type="button" class="btn-roxo" onclick="gerarNotaFiscalOS()">
            🧾 Preparar prévia fiscal
          </button>
        </div>
      </section>

      <section class="secao">
        <h2>Lista de ordens de serviço</h2>

        <div class="linha-lista">
          <button type="button" onclick="listarOS()">
            🔄 Atualizar lista
          </button>
        </div>

        <div id="listaOS"></div>
      </section>

    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js?v=20"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const campo = document.getElementById("dataCompraOS");
      if (campo && !campo.value) campo.value = new Date().toISOString().split("T")[0];
    });
    document
      .getElementById("pagamentoOS")
      .addEventListener("change", function () {
        const parcelas = document.getElementById("parcelasCartao");

        if (this.value === "Cartão de Crédito") {
          parcelas.style.display = "block";
        } else {
          parcelas.style.display = "none";
          parcelas.value = "";
        }
      });
  </script>

</body>
</html>
