<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Receituário - Óticas Ventura</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="caixa-login">
<h1>Receituário</h1>
  <input id="buscaClienteReceita" placeholder="Buscar cliente por nome / telefone / CPF">
<button onclick="buscarClienteReceita()">🔍 Buscar</button>
  <button onclick="apagarReceita()" style="background:#d32f2f;color:white;margin-left:8px;">
🗑️ Excluir Receita
</button>
<br><br>

<input id="clienteReceita" type="text" placeholder="Nome do Cliente"><br><br>
<input id="telefoneReceita" type="text" placeholder="Telefone"><br><br>
  <input id="cpfReceita" type="text" placeholder="CPF"><br><br>
<div class="tabela-receita">

  <table>
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Olho</th>
        <th>Esférico</th>
        <th>Cilíndrico</th>
        <th>Eixo</th>
        <th>Altura</th>
        <th>DNP</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>LONGE</td>
        <td>OD</td>
        <td><input id="odLongeEsferico" placeholder="Esférico" oninput="calcularPerto()"></td>
        <td><input id="odLongeCilindrico" placeholder="Cilíndrico" oninput="calcularPerto()"></td>
        <td><input id="odLongeEixo" placeholder="Eixo" oninput="calcularPerto()"></td>
        <td><input id="altura" placeholder="Altura"></td>
        <td><input id="dnp" placeholder="DNP"></td>
      </tr>

      <tr>
        <td>LONGE</td>
        <td>OE</td>
        <td><input id="oeLongeEsferico" placeholder="Esférico" oninput="calcularPerto()"></td>
        <td><input id="oeLongeCilindrico" placeholder="Cilíndrico" oninput="calcularPerto()"></td>
        <td><input id="oeLongeEixo" placeholder="Eixo" oninput="calcularPerto()"></td>
        <td><input id="alturaOE" placeholder="Altura"></td>
        <td><input id="dnpOE" placeholder="DNP"></td>
      </tr>

      <tr>
  <td>PERTO</td>
  <td>OD</td>
  <td><input id="odPertoEsferico" placeholder="Esférico"></td>
  <td><input id="odPertoCilindrico" placeholder="Cilíndrico"></td>
  <td><input id="odPertoEixo" placeholder="Eixo"></td>
  <td><input id="alturaPertoOD" placeholder="Altura"></td>
  <td><input id="dnpPertoOD" placeholder="DNP"></td>
</tr>

<tr>
  <td>PERTO</td>
  <td>OE</td>
  <td><input id="oePertoEsferico" placeholder="Esférico"></td>
  <td><input id="oePertoCilindrico" placeholder="Cilíndrico"></td>
  <td><input id="oePertoEixo" placeholder="Eixo"></td>
  <td><input id="alturaPertoOE" placeholder="Altura"></td>
  <td><input id="dnpPertoOE" placeholder="DNP"></td>
</tr>
    </tbody>
  </table>

  <div style="margin-top:15px;">
    <input id="adicao" placeholder="Adição" oninput="calcularPerto()">
  </div>

</div>


<textarea id="obsReceita" placeholder="Observações"></textarea><br><br>

<button onclick="salvarReceituario()">Salvar Receituário</button>
  <button type="button" onclick="listarReceitasCliente()">
  Ver receitas salvas
</button>

<div id="listaReceitasCliente"></div>
  <br><br>
<button onclick="imprimirReceita()">Imprimir Receita</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>

</body>
</html>
